<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无归</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background-color: #000;
            color: #fff;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
        }
        
        .main-content {
            flex: 1;
            background-color: #333;
            border-radius: 5px;
            padding: 20px;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
        }
        
        /* 存档界面 */
        .save-load-screen {
            text-align: center;
            flex: 1;
            margin-top: 100px;
        }
        
        .save-load-screen h1 {
            font-size: 36px;
            margin-bottom: 50px;
            background: linear-gradient(to right, #ff6b9d, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .button {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background-color: #8b4513;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .button:hover {
            background-color: #a0522d;
        }
        
        /* 游戏主界面 */
        .game-screen {
            display: none;
            flex: 1;
            display: flex;
        }
        
        /* 右侧功能按钮列 */
        .sidebar {
            width: 140px;
            background-color: #333;
            border-radius: 5px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #fff;
        }
        
        .sidebar-button {
            padding: 10px;
            background-color: #444;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .sidebar-button:hover {
            background-color: #555;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 5px;
            }
            
            .game-screen {
                flex-direction: column;
            }
            
            .main-content {
                margin-right: 0;
                margin-bottom: 10px;
            }
            
            .sidebar {
                width: 100%;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: space-between;
            }
            
            .sidebar-button {
                flex: 1 1 45%;
                min-width: 0;
            }
        }
        
        /* 弹出界面 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
        }
        
        .modal-content {
            background-color: #333;
            margin: 15% auto;
            padding: 20px;
            border-radius: 5px;
            width: 80%;
            max-width: 600px;
            position: relative;
        }
        
        .close {
            position: absolute;
            right: 10px;
            top: 10px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .close:hover {
            color: #ff6b9d;
        }
        
        /* 顶部信息栏 */
        .top-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            border: 1px solid #fff;
        }
        
        .location-info {
            width: 30%;
        }
        
        .location-info .place {
            font-size: 18px;
            font-weight: bold;
        }
        
        .location-info .coordinates {
            font-size: 14px;
            color: #666;
        }
        
        .realm-info {
            width: 40%;
            text-align: center;
        }
        
        .realm-info .realm {
            font-size: 18px;
            font-weight: bold;
        }
        
        .realm-info .cultivation {
            font-size: 14px;
        }
        
        .time-info {
            width: 30%;
            text-align: right;
        }
        
        .time-info .year {
            font-size: 18px;
            font-weight: bold;
        }
        
        /* 中间属性栏 */
        .middle-info {
            display: flex;
            margin-bottom: 20px;
        }
        
        .spiritual-root {
            width: 40%;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid #fff;
        }
        
        .spiritual-root > div {
            padding: 15px;
            background-color: #444;
            border-radius: 5px;
            flex: 1;
        }
        
        .spiritual-root h3 {
            margin-bottom: 10px;
            color: #fff;
        }
        
        .stats {
            width: 60%;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            border: 1px solid #fff;
        }
        
        .stats h3 {
            margin-bottom: 10px;
            color: #fff;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: #444;
            border-radius: 5px;
        }
        
        /* 日志区域 */
        .log-area {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            flex: 1;
            min-height: 300px;
            border: 1px solid #fff;
        }
        
        /* 操作区域 */
        .action-area {
            display: flex;
        }
        
        .movement {
            width: 40%;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-right: 10px;
            border: 1px solid #fff;
        }
        
        .movement h3 {
            margin-bottom: 10px;
            color: #fff;
        }
        
        .move-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            height: 150px;
        }
        
        .move-button:nth-child(1) {
            grid-column: 2;
            grid-row: 1;
        }
        
        .move-button:nth-child(2) {
            grid-column: 1;
            grid-row: 2;
        }
        
        .move-button:nth-child(3) {
            grid-column: 2;
            grid-row: 2;
        }
        
        .move-button:nth-child(4) {
            grid-column: 3;
            grid-row: 2;
        }
        
        .move-button {
            padding: 10px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .move-button:hover {
            background-color: #555;
        }
        
        .move-button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        
        .other-actions {
            width: 60%;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            border: 1px solid #fff;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .action-button {
            padding: 10px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .action-button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <!-- 存档界面 -->
    <div class="container save-load-container">
        <div class="save-load-screen" id="saveLoadScreen">
            <h1>无归</h1>
            <button class="button" onclick="startNewGame()">新开一局</button>
            <button class="button" onclick="loadGame()">读取存档</button>
        </div>
    </div>
    
    <!-- 游戏主界面 -->
    <div class="container game-container" style="display: none;">
        <div class="game-screen" id="gameScreen">
            <div class="main-content">
                <!-- 顶部信息栏 -->
                <div class="top-info">
                    <div class="location-info">
                        <div class="place" id="currentPlace">青丘山</div>
                        <div class="coordinates" id="currentCoordinates">(0, 0)</div>
                    </div>
                    <div class="realm-info">
                        <div class="realm" id="currentRealm">练气</div>
                        <div class="cultivation" id="currentCultivation">修为: 0/100 | 年龄: 18/100</div>
                    </div>
                    <div class="time-info">
                        <div class="year" id="currentYear">第1年</div>
                    </div>
                </div>
                
                <!-- 中间属性栏 -->
                <div class="middle-info">
                    <div class="spiritual-root">
                        <div id="spiritualRoot">灵根：五灵根</div>
                        <div id="constitution">体质：凡人之体</div>
                    </div>
                    <div class="stats">
                        <div class="stats-grid">
                            <div class="stat-item">
                                <span>攻击:</span>
                                <span id="attack">10</span>
                            </div>
                            <div class="stat-item">
                                <span>防御:</span>
                                <span id="defense">5</span>
                            </div>
                            <div class="stat-item">
                                <span>气血:</span>
                                <span id="health">100</span>
                            </div>
                            <div class="stat-item">
                                <span>悟性:</span>
                                <span id="wisdom">8</span>
                            </div>
                            <div class="stat-item">
                                <span>气运:</span>
                                <span id="luck">5</span>
                            </div>
                            <div class="stat-item">
                                <span>灵石:</span>
                                <span id="spiritStone">100</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 日志区域 -->
                <div class="log-area" id="logArea">
                    欢迎来到修仙世界！
                </div>
                
                <!-- 操作区域 -->
                <div class="action-area">
                    <div class="movement">
                        <h3>移动</h3>
                        <div class="move-buttons">
                            <button class="move-button" onclick="move('up')">↑</button>
                            <button class="move-button" onclick="move('left')">←</button>
                            <button class="move-button" onclick="move('down')">↓</button>
                            <button class="move-button" onclick="move('right')">→</button>
                        </div>
                    </div>
                    <div class="other-actions">
                        <div class="action-buttons">
                            <button class="action-button" onclick="meditate()">打坐修炼 (1年)</button>
                            <button class="action-button" onclick="explore()">探索 (1年)</button>
                            <button class="action-button" onclick="rest()">休息 (1年)</button>
                            <button class="action-button" onclick="saveGame()">保存游戏</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 右侧功能按钮列 -->
            <div class="sidebar">
                <button class="sidebar-button" onclick="openModal('innerVisionModal')">内视</button>
                <button class="sidebar-button" onclick="openModal('backpackModal')">背包</button>
                <button class="sidebar-button" onclick="openModal('ringModal')">古戒</button>
                <button class="sidebar-button" onclick="openModal('logModal')">日志</button>
                <button class="sidebar-button" onclick="openModal('achievementModal')">成就</button>
                <button class="sidebar-button" onclick="openModal('settingsModal')">设置</button>
            </div>
        </div>
    </div>
    
    <script>
        // 游戏数据
        let gameData = {
            player: {
                realm: 0, // 0: 凡人, 1: 练气, 2: 筑基, 3: 金丹, 4: 元婴, 5: 化神, 6: 炼虚, 7: 合体, 8: 大乘, 9: 仙
                cultivation: 0,
                age: 18,
                lifespan: 80,
                coordinates: [0, 0],
                place: "青丘山",
                spiritualRoot: "五灵根",
                constitution: "凡人之体",
                stats: {
                    attack: 10,
                    defense: 5,
                    health: 100,
                    wisdom: 8,
                    luck: 5,
                    spiritStone: 100
                }
            },
            time: 1
        };
        
        // 境界名称
        const realmNames = ["凡人", "练气", "筑基", "金丹", "元婴", "化神", "炼虚", "合体", "大乘", "仙"];
        
        // 境界颜色
        const realmColors = ["#888", "#fff", "#0f0", "#00f", "#80f", "#ff8c00", "#f00", "#ffd700", "#0ff", "linear-gradient(to right, #ffd700, #ff8c00)"];
        
        // 境界修为区间
        const realmCultivation = [
            [0, 0],              // 凡人
            [1, 600],            // 练气
            [601, 3000],         // 筑基
            [3001, 12600],       // 金丹
            [12601, 51000],      // 元婴
            [51001, 204600],     // 化神
            [204601, 819000],    // 炼虚
            [819001, 3276600],   // 合体
            [3276601, 10000000], // 大乘
            [10000001, Infinity] // 仙
        ];
        
        // 境界寿命
        const realmLifespan = [80, 100, 200, 400, 800, 1600, 3200, 6400, 12800, Infinity];
        
        // 开始新游戏
        function startNewGame() {
            // 重置游戏数据
            gameData = {
                player: {
                    realm: 0, // 凡人
                    cultivation: 0,
                    age: 18,
                    lifespan: 80,
                    coordinates: [0, 0],
                    place: "青丘山",
                    spiritualRoot: "五灵根",
                    constitution: "凡人之体",
                    stats: {
                        attack: 10,
                        defense: 5,
                        health: 100,
                        wisdom: 8,
                        luck: 5,
                        spiritStone: 100
                    }
                },
                time: 1
            };
            
            updateGameUI();
            document.querySelector('.save-load-container').style.display = 'none';
            document.querySelector('.game-container').style.display = 'flex';
        }
        
        // 读取存档
        function loadGame() {
            // 这里只是模拟读取存档，实际应该从localStorage或其他存储中读取
            updateGameUI();
            document.querySelector('.save-load-container').style.display = 'none';
            document.querySelector('.game-container').style.display = 'flex';
            showLog("存档读取成功！");
        }
        
        // 保存游戏
        function saveGame() {
            // 这里只是模拟保存游戏，实际应该保存到localStorage或其他存储中
            showLog("游戏已保存！");
        }
        
        // 移动
        function move(direction) {
            const [x, y] = gameData.player.coordinates;
            
            switch(direction) {
                case 'up':
                    gameData.player.coordinates = [x, y + 1];
                    break;
                case 'down':
                    gameData.player.coordinates = [x, y - 1];
                    break;
                case 'left':
                    gameData.player.coordinates = [x - 1, y];
                    break;
                case 'right':
                    gameData.player.coordinates = [x + 1, y];
                    break;
            }
            
            // 根据坐标更新地点（这里简化处理，实际应该有地图系统）
            updatePlace();
            
            // 增加时间
            gameData.time++;
            
            // 增加年龄
            gameData.player.age++;
            
            // 更新UI
            updateGameUI();
            showLog(`你向${direction === 'up' ? '上' : direction === 'down' ? '下' : direction === 'left' ? '左' : '右'}移动了一步，消耗了1年时间，年龄增加了1岁。`);
        }
        
        // 根据坐标更新地点
        function updatePlace() {
            // 这里简化处理，实际应该有地图系统
            gameData.player.place = "青丘山";
        }
        
        // 打坐修炼
        function meditate() {
            // 增加修为
            gameData.player.cultivation += 10 + Math.floor(gameData.player.stats.wisdom / 2);
            
            // 检查是否突破境界
            checkRealm突破();
            
            // 增加时间
            gameData.time++;
            
            // 增加年龄
            gameData.player.age++;
            
            // 更新UI
            updateGameUI();
            showLog("你打坐修炼了一年，修为有所提升，年龄增加了1岁。");
        }
        
        // 探索
        function explore() {
            // 随机获得一些灵石
            const gain = Math.floor(Math.random() * 20) + 5;
            gameData.player.stats.spiritStone += gain;
            
            // 增加时间
            gameData.time++;
            
            // 增加年龄
            gameData.player.age++;
            
            // 更新UI
            updateGameUI();
            showLog(`你探索了一年，获得了${gain}块灵石，年龄增加了1岁。`);
        }
        
        // 休息
        function rest() {
            // 恢复一些寿命
            gameData.player.lifespan = Math.min(gameData.player.lifespan + 3, 100); // 直接增加3点寿命上限
            
            // 增加时间
            gameData.time++;
            
            // 增加年龄
            gameData.player.age++;
            
            // 更新UI
            updateGameUI();
            showLog("你休息了一年，恢复了3点寿命上限，年龄增加了1岁。");
        }
        
        // 检查境界突破
        function checkRealm突破() {
            // 检查是否需要降级到更低境界
            while (gameData.player.realm > 0 && gameData.player.cultivation < realmCultivation[gameData.player.realm][0]) {
                gameData.player.realm--;
                gameData.player.lifespan = realmLifespan[gameData.player.realm];
                showLog(`你的修为下降，境界降至${realmNames[gameData.player.realm]}！`);
            }
            
            // 检查是否突破到下一个境界（大乘圆满到仙需要特殊晋级方式）
            while (gameData.player.realm < 8 && gameData.player.cultivation >= realmCultivation[gameData.player.realm + 1][0]) {
                gameData.player.realm++;
                gameData.player.lifespan = realmLifespan[gameData.player.realm];
                showLog(`恭喜你突破到${realmNames[gameData.player.realm]}境界！`);
            }
        }
        
        // 更新游戏UI
        function updateGameUI() {
            // 更新地点和坐标
            document.getElementById('currentPlace').textContent = gameData.player.place;
            document.getElementById('currentCoordinates').textContent = `(${gameData.player.coordinates[0]}, ${gameData.player.coordinates[1]})`;
            
            // 计算修为阶段
            let cultivationStage = '';
            if (gameData.player.realm === 0) {
                cultivationStage = '';
            } else if (gameData.player.realm === 9) {
                cultivationStage = '';
            } else {
                const currentCultivation = gameData.player.cultivation;
                const [min, max] = realmCultivation[gameData.player.realm];
                const range = max - min;
                
                if (currentCultivation <= min + range * 0.2) {
                    cultivationStage = '前期';
                } else if (currentCultivation <= min + range * 0.4) {
                    cultivationStage = '中期';
                } else if (currentCultivation <= min + range * 0.7) {
                    cultivationStage = '后期';
                } else {
                    cultivationStage = '圆满';
                }
            }
            
            // 更新境界和修为
            const realmElement = document.getElementById('currentRealm');
            realmElement.textContent = gameData.player.realm === 9 ? 
                `${realmNames[gameData.player.realm]}` : 
                `${realmNames[gameData.player.realm]} ${cultivationStage}`;
            
            // 设置境界颜色
            if (gameData.player.realm === 9) {
                // 仙境界使用渐变色
                realmElement.style.background = realmColors[gameData.player.realm];
                realmElement.style.webkitBackgroundClip = 'text';
                realmElement.style.webkitTextFillColor = 'transparent';
                realmElement.style.backgroundClip = 'text';
            } else {
                // 其他境界使用纯色
                realmElement.style.color = realmColors[gameData.player.realm];
                realmElement.style.background = 'none';
                realmElement.style.webkitBackgroundClip = 'none';
                realmElement.style.webkitTextFillColor = 'none';
                realmElement.style.backgroundClip = 'none';
            }
            
            // 更新修为和年龄
            const cultivationText = gameData.player.realm === 9 ? 
                `修为: 仙 | 年龄: ${gameData.player.age}/${gameData.player.lifespan === Infinity ? '无穷' : gameData.player.lifespan}` :
                `修为: ${gameData.player.cultivation} | 年龄: ${gameData.player.age}/${gameData.player.lifespan === Infinity ? '无穷' : gameData.player.lifespan}`;
            document.getElementById('currentCultivation').textContent = cultivationText;
            
            // 更新时间
            document.getElementById('currentYear').textContent = `第${gameData.time}年`;
            
            // 更新灵根和体质
            document.getElementById('spiritualRoot').textContent = `灵根：${gameData.player.spiritualRoot}`;
            document.getElementById('constitution').textContent = `体质：${gameData.player.constitution}`;
            
            // 更新六维数据
            document.getElementById('attack').textContent = gameData.player.stats.attack;
            document.getElementById('defense').textContent = gameData.player.stats.defense;
            document.getElementById('health').textContent = gameData.player.stats.health;
            document.getElementById('wisdom').textContent = gameData.player.stats.wisdom;
            document.getElementById('luck').textContent = gameData.player.stats.luck;
            document.getElementById('spiritStone').textContent = gameData.player.stats.spiritStone;
        }
        
        // 显示日志
        function showLog(message) {
            document.getElementById('logArea').textContent = message;
        }
        
        // 打开模态框
        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'block';
        }
        
        // 关闭模态框
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }
        
        // 点击模态框外部关闭
        window.onclick = function(event) {
            const modals = document.getElementsByClassName('modal');
            for (let i = 0; i < modals.length; i++) {
                const modal = modals[i];
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            }
        }
        
        // 修改修为
        function updateCultivation() {
            const cultivationInput = document.getElementById('cultivationInput');
            const newCultivation = parseInt(cultivationInput.value);
            
            if (!isNaN(newCultivation) && newCultivation >= 0) {
                gameData.player.cultivation = newCultivation;
                checkRealm突破();
                updateGameUI();
                showLog(`修为已修改为 ${newCultivation}`);
                closeModal('settingsModal');
            } else {
                showLog('请输入有效的修为值');
            }
        }
    </script>
